name = "random_graph_lib"
version = "0.1.0"
defaultTargets = ["PseudorandomLib", "GirthLib", "RandomGraphLib"]
requiresModuleSystem = true

[leanOptions]
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "PseudorandomLib"
globs = ["PseudorandomLib.+"]

[[lean_lib]]
name = "GirthLib"
globs = ["GirthLib.+"]

[[lean_lib]]
name = "RandomGraphLib"
globs = ["RandomGraphLib.+"]
